<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathias Moore | Network Engineering &amp; CS Graduate</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #080c14; --bg2: #0d1320; --bg3: #111826; --card: #131c2e; --card2: #192236;
      --electric: #00d4ff; --electric-dim: rgba(0,212,255,0.15);
      --amber: #ffb347; --amber-dim: rgba(255,179,71,0.15);
      --lime: #39ff82; --lime-dim: rgba(57,255,130,0.12);
      --violet: #7c5cff; --text: #e8edf5; --muted: #8a96b0; --border: rgba(0,212,255,0.12);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--electric); border-radius: 3px; }
    .container { max-width: 1200px; width: 92%; margin: 0 auto; }
    .navbar { position: fixed; top: 0; width: 100%; z-index: 999; padding: 1.2rem 0; transition: .3s; }
    .navbar.solid { background: rgba(8,12,20,.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--electric), var(--lime)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.02em; }
    .nav-links { display: flex; gap: .4rem; list-style: none; }
    .nav-links a { font-size: .88rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: .45rem .9rem; border-radius: 30px; transition: .2s; }
    .nav-links a:hover { color: var(--electric); background: var(--electric-dim); }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; text-align: center; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,212,255,.08) 0%, transparent 70%), radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,92,255,.06) 0%, transparent 60%), var(--bg); overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,212,255,.04) 1px, transparent 1px); background-size: 42px 42px; }
    .hero-tag { display: inline-block; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--electric); background: var(--electric-dim); border: 1px solid rgba(0,212,255,.25); padding: .4rem 1rem; border-radius: 30px; margin-bottom: 1.4rem; }
    .hero-content h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.8rem, 7vw, 5.5rem); font-weight: 800; line-height: 1.05; letter-spacing: -.03em; margin-bottom: 1.2rem; }
    .hero-content h1 span { background: linear-gradient(120deg, #fff 0%, var(--electric) 50%, var(--lime) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tagline { font-size: 1.1rem; color: var(--muted); max-width: 580px; margin: 0 auto 2rem; }
    .hero-badges { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-bottom: 2.4rem; }
    .badge { font-size: .8rem; font-weight: 600; padding: .35rem .85rem; border-radius: 6px; }
    .badge-blue { background: var(--electric-dim); color: var(--electric); border: 1px solid rgba(0,212,255,.2); }
    .badge-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(255,179,71,.2); }
    .badge-lime { background: var(--lime-dim); color: var(--lime); border: 1px solid rgba(57,255,130,.2); }
    .hero-cta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary { display: inline-flex; align-items: center; gap: .5rem; font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 600; padding: .75rem 1.6rem; border-radius: 8px; background: var(--electric); color: #040810; text-decoration: none; transition: .2s; border: none; cursor: pointer; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,.3); }
    .btn-outline { display: inline-flex; align-items: center; gap: .5rem; font-size: .9rem; font-weight: 600; padding: .75rem 1.6rem; border-radius: 8px; border: 1.5px solid var(--border); color: var(--text); text-decoration: none; transition: .2s; }
    .btn-outline:hover { border-color: var(--electric); color: var(--electric); }
    .scroll-indicator { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); animation: bob 2.2s ease-in-out infinite; color: var(--electric); font-size: 1.3rem; opacity: .6; text-decoration: none; }
    @keyframes bob { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(10px);} }
    section { padding: 6rem 0; }
    .section-label { font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--electric); margin-bottom: .8rem; }
    .section-title { font-family: 'Syne', sans-serif; font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: 3rem; }
    .section-title span { color: var(--electric); }
    .about-grid { display: grid; grid-template-columns: 280px 1fr; gap: 4rem; align-items: start; }
    .profile-wrap { text-align: center; }
    .profile-photo { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; object-position: center top; margin: 0 auto; display: block; border: 3px solid var(--electric); box-shadow: 0 0 0 8px var(--electric-dim), 0 0 40px rgba(0,212,255,.2); }
    .profile-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; margin-top: 1rem; }
    .profile-role { font-size: .85rem; color: var(--electric); margin-top: .3rem; }
    .cert-pill { display: inline-flex; align-items: center; gap: .4rem; margin-top: 1rem; font-size: .8rem; font-weight: 600; color: var(--amber); background: var(--amber-dim); border: 1px solid rgba(255,179,71,.2); padding: .35rem .85rem; border-radius: 30px; }
    .about-text p { color: var(--muted); margin-bottom: 1.1rem; line-height: 1.75; }
    .about-text p:last-child { margin-bottom: 0; }
    .skills-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    .skill-tag { font-size: .78rem; font-weight: 600; padding: .3rem .75rem; border-radius: 5px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); transition: .2s; }
    .skill-tag:hover { border-color: var(--electric); color: var(--electric); }
    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, var(--electric), var(--violet)); border-radius: 1px; }
    .tl-item { position: relative; margin-bottom: 2.5rem; padding-left: 1.5rem; }
    .tl-item::before { content: ''; position: absolute; left: -2.15rem; top: .45rem; width: 12px; height: 12px; border-radius: 50%; background: var(--electric); box-shadow: 0 0 0 3px var(--electric-dim); }
    .tl-top { display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .tl-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; }
    .tl-org { color: var(--electric); font-size: .88rem; font-weight: 500; }
    .tl-date { margin-left: auto; font-size: .78rem; font-weight: 600; background: var(--amber-dim); color: var(--amber); padding: .25rem .7rem; border-radius: 5px; white-space: nowrap; }
    .tl-desc { color: var(--muted); font-size: .9rem; line-height: 1.7; }
    .tl-desc ul { padding-left: 1.2rem; margin-top: .4rem; }
    .tl-desc li { margin-bottom: .3rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .proj-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.6rem; transition: .3s; position: relative; overflow: hidden; }
    .proj-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--electric-dim) 0%, transparent 60%); opacity: 0; transition: .3s; }
    .proj-card:hover { transform: translateY(-6px); border-color: rgba(0,212,255,.35); box-shadow: 0 16px 40px rgba(0,212,255,.08); }
    .proj-card:hover::before { opacity: 1; }
    .proj-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 1rem; background: var(--electric-dim); color: var(--electric); }
    .proj-icon.amber { background: var(--amber-dim); color: var(--amber); }
    .proj-icon.lime { background: var(--lime-dim); color: var(--lime); }
    .proj-icon.violet { background: rgba(124,92,255,.15); color: var(--violet); }
    .proj-tech { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--electric); margin-bottom: .5rem; }
    .proj-tech.amber { color: var(--amber); }
    .proj-tech.lime { color: var(--lime); }
    .proj-tech.violet { color: var(--violet); }
    .proj-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.15rem; margin-bottom: .7rem; }
    .proj-desc { color: var(--muted); font-size: .88rem; line-height: 1.65; margin-bottom: 1.2rem; }
    .proj-links { display: flex; gap: .7rem; flex-wrap: wrap; position: relative; z-index: 2; }
    .proj-link { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 600; padding: .35rem .85rem; border-radius: 6px; text-decoration: none; transition: .2s; }
    .proj-link.primary { background: var(--electric-dim); color: var(--electric); border: 1px solid rgba(0,212,255,.2); }
    .proj-link.primary:hover { background: var(--electric); color: #040810; }
    .proj-link.secondary { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
    .proj-link.secondary:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
    .topo-overlay { display:none; position:fixed; inset:0; background:rgba(4,8,16,.92); z-index:9999; align-items:center; justify-content:center; padding:1.5rem; }
    .topo-overlay.open { display:flex; }
    .topo-box { background:var(--card); border:1px solid rgba(0,212,255,.3); border-radius:16px; max-width:95vw; max-height:90vh; overflow:auto; padding:1.5rem; position:relative; box-shadow:0 0 60px rgba(0,212,255,.15); }
    .topo-box img { max-width:100%; height:auto; border-radius:8px; display:block; }
    .topo-close { position:sticky; top:0; float:right; background:var(--electric); color:#040810; border:none; border-radius:50%; width:34px; height:34px; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:800; transition:.2s; z-index:10; margin-bottom:.5rem; }
    .topo-close:hover { transform:scale(1.1); box-shadow:0 4px 12px rgba(0,212,255,.4); }
    .contact-box { background: var(--card2); border: 1px solid var(--border); border-radius: 24px; padding: 3.5rem; text-align: center; position: relative; overflow: hidden; }
    .contact-box::before { content: ''; position: absolute; top: -60px; right: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,255,.1) 0%, transparent 70%); }
    .contact-box::after { content: ''; position: absolute; bottom: -60px; left: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,255,.08) 0%, transparent 70%); }
    .contact-intro { color: var(--muted); max-width: 500px; margin: 0 auto 2.5rem; }
    .contact-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
    .contact-item { display: flex; align-items: center; gap: .7rem; background: var(--bg3); border: 1px solid var(--border); padding: .65rem 1.2rem; border-radius: 10px; font-size: .88rem; transition: .2s; }
    .contact-item:hover { border-color: rgba(0,212,255,.3); }
    .contact-item i { color: var(--electric); }
    .contact-item a { color: var(--text); text-decoration: none; }
    .contact-item a:hover { color: var(--electric); }
    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--border); }
    @media(max-width: 768px){
      .about-grid { grid-template-columns: 1fr; }
      .profile-wrap { order: -1; }
      .profile-photo { width: 150px; height: 150px; }
      .nav-links { display: none; }
      section { padding: 4rem 0; }
    }
  </style>
</head>

<script>
  $(window).scroll(function(){
    $('#navbar').toggleClass('solid', $(this).scrollTop() > 50);
  });

  // Fixed smooth-scroll: only intercepts internal hash links, leaves external links alone
  $(document).on('click', 'a', function(e){
    var href = this.getAttribute('href');
    if(href && href.startsWith('#') && href.length > 1){
      var target = $(href);
      if(target.length){ e.preventDefault(); $('html,body').animate({scrollTop:target.offset().top - 72},600); }
    }
  });

  // Topology lightbox
  $(document).on('click', '.js-topo', function(e){
    e.preventDefault();
    $('#topoOverlay').addClass('open');
  });
  $('#topoClose, #topoOverlay').on('click', function(e){
    if(e.target === document.getElementById('topoOverlay') || e.target === document.getElementById('topoClose')){
      $('#topoOverlay').removeClass('open');
    }
  });
  $(document).on('keydown', function(e){ if(e.key==='Escape') $('#topoOverlay').removeClass('open'); });
</script>
